# Canonical insurers for the Phoenix metro.
#
# Matching order (hpc/normalize/payers.py):
#   1. config/payer_decisions.csv   your reviewed decisions (always win)
#   2. `patterns` below             regex on the cleaned, upper-cased payer name (first match wins,
#                                   so more specific entries come first)
#   3. NIM embeddings               nearest canonical name; auto-accepted only above the threshold
#   4. otherwise                    kept under its own cleaned name ("other:<name>") and, if close
#                                   to a canonical insurer, listed in data/review/payer_review.csv
#
# `parent` groups brands of one company (for display); `default_plan_type` is used when neither
# the payer nor the plan name says what kind of coverage it is.

[matching]
auto_accept = 0.72        # embedding similarity needed to accept automatically. Checked 2026-11-22 on
                          # 130 alias-labelled names (leave-one-out): >=0.70 was 100% correct, >=0.60 95%.
min_margin = 0.06         # and this far ahead of the second-best insurer
review_floor = 0.55       # between review_floor and auto_accept -> review file
default_top = ["uhc", "bcbs_az", "aetna", "cigna", "humana"]   # M2 default insurers to show first

# ---------------------------------------------------------------- government programs first
[[payer]]
id = "tricare"
name = "TRICARE"
patterns = ['TRICARE', 'HEALTH ?NET FEDERAL', 'HUMANA MILITARY']
default_plan_type = "tricare"

[[payer]]
id = "va_ccn"
name = "VA Community Care (TriWest)"
patterns = ['TRIWEST', '\bVA CCN\b', '\bTRIWEST VA\b', 'VETERANS']
default_plan_type = "va"

[[payer]]
id = "medicare"
name = "Medicare (traditional)"
patterns = ['^MEDICARE$', '^MEDICARE (B|A)\b', 'MEDICARE SHADOW', '^MEDICARE PART', '\bNORIDIAN\b']
default_plan_type = "medicare"

[[payer]]
id = "medicare_advantage_generic"
name = "Medicare Advantage (unspecified plan)"
patterns = ['^GENERIC MEDICARE ADV']
default_plan_type = "medicare_advantage"

