# Procedures covered (M2 default: common shoppable services, mostly from CMS's shoppable list).
#
# keywords: regex used to pick out rows that have NO standard code but whose description might be
#           this procedure (Phase 3 then decides with embeddings). aka: other phrasings used as anchors.
#
# Each procedure has one main code and optional related codes (close variants kept in the
# extract so Phase 3 can decide what is comparable). code_family decides which code types
# in a price file count as a match:
#   cpt  -> CPT, HCPCS          (outpatient / professional services)
#   drg  -> MS-DRG, TRIS-DRG    (inpatient stays; TRICARE uses MS-DRG numbering)
# APR-DRG (used by Medicaid) numbers stays differently, so it never matches an MS-DRG code.

[families]
cpt = ["CPT", "HCPCS"]
drg = ["MS-DRG", "TRIS-DRG"]

