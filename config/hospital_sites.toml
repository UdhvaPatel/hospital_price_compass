# Where to look for each hospital's cms-hpt.txt.
#
# CMS's hospital list has no website column, so this is curated by hand.
# [systems.*]  : display name, name pattern (regex on the CMS facility name, case-insensitive) -> website domains.
# [overrides.*]: per CCN; wins over systems. `location` pins the cms-hpt.txt location-name
#                when the names differ too much for automatic matching.

[systems.banner]
display = "Banner Health"
pattern = "^BANNER"
domains = ["www.bannerhealth.com"]

[systems.honorhealth]
display = "HonorHealth"
pattern = "HONOR ?HEALTH"
domains = ["www.honorhealth.com"]

[systems.dignity]
display = "Dignity Health (CommonSpirit)"
pattern = "DIGNITY HEALTH|ST JOSEPHS HOSPITAL|CHANDLER REGIONAL|MERCY GILBERT"
domains = ["www.commonspirit.org"]

[systems.abrazo]
display = "Abrazo Health (Tenet)"
pattern = "^ABRAZO"
domains = ["www.abrazohealth.com"]

[systems.valleywise]
display = "Valleywise Health"
pattern = "VALLEYWISE"
domains = ["valleywisehealth.org"]

[systems.mayo]
display = "Mayo Clinic"
pattern = "MAYO CLINIC"
domains = ["www.mayoclinic.org"]

[systems.phoenix_childrens]
display = "Phoenix Children's"
pattern = "PHOENIX CHILDREN"
domains = ["phoenixchildrens.org"]

[systems.city_of_hope]
display = "City of Hope"
pattern = "CITY OF HOPE"
domains = ["www.cityofhope.org"]

[systems.exceptional]
display = "Exceptional HealthCare"
pattern = "EXCEPTIONAL COMMUNITY HOSPITAL"
domains = ["ehc24.com"]

[overrides.030152]  # Exceptional Community Hospital - Maricopa
# Its file labels every code "CDM", but the values are CPT codes (e.g. 10060 = I&D of abscess).
code_type_aliases = { CDM = "CPT" }

[overrides.030107]  # Arizona Spine and Joint Hospital
domains = ["azspineandjoint.com"]

[overrides.030108]  # The CORE Institute Specialty Hospital
domains = ["www.thecoreinstitutehospital.com"]

[overrides.030112]  # Arizona Orthopedic and Surgical Specialty Hospital (website not yet identified)
domains = ["www.aosh.com"]

[overrides.030153]  # East Valley ER & Hospital (Nutex Health)
domains = ["www.eastvalleyhospital.com"]

[overrides.031300]  # Wickenburg Community Hospital
domains = ["www.wickhosp.com"]

[overrides.030138]  # City of Hope Phoenix (Goodyear) is listed under its legal entity name
domains = ["www.cityofhope.org"]
location = "Western Regional Medical Center"
mrf_url = "https://www.cityofhope.org/320197974_western-regional-medical-center-_standardcharges.json"

[overrides.030136]  # CMS: "Dignity Health - Arizona General Hospital", Laveen
domains = ["www.commonspirit.org"]
location = "Arizona General Hospital Laveen"

[overrides.030139]  # CMS: "Dignity Health Arizona General Hospital", Mesa
domains = ["www.commonspirit.org"]
location = "Arizona General Hospital Mesa"

[overrides.030093]  # CMS "Banner Del E. Webb" vs file "Banner Del Webb"
domains = ["www.bannerhealth.com"]
location = "Banner Del Webb Medical Center"
mrf_url = "https://images.pricetransparency.healthcare/public-mrfs/banner/900389312_banner-del-e-webb-medical-center_standardcharges.csv"

[overrides.030103]  # Mayo lists its Phoenix hospital as "Mayo Clinic Arizona"
location = "Mayo Clinic Arizona"

