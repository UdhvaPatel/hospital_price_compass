name: refresh

# Monthly (and when the weekly check finds changes, or by hand):
# discovery -> download (changed files only) -> parse -> normalise -> quality -> audit -> statistics
# -> summaries -> site build; state saved to the private vault; site published; issue opened on problems.
on:
  schedule:
    - cron: "23 10 3 * *"     # the 3rd of each month, 10:23 UTC
  workflow_dispatch:

permissions:
  contents: write             # commit the rebuilt site data
  issues: write               # report problems
  pages: write                # deploy GitHub Pages
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300      # free runners stop at 6 hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore pipeline state from the private vault
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: python -m hpc.vault pull

      - name: Run the pipeline
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m hpc.pipeline refresh

      - name: Save pipeline state to the private vault
        if: always()
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: python -m hpc.vault push

      - name: Commit the rebuilt site data
        run: |
          git config user.name "hospital-price-compass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data data/phase0 data/registry
          if git diff --cached --quiet; then
            echo "site data unchanged"
          else
            git commit -m "Monthly refresh: site data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open or update an issue if there were problems
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/logs/problems.json ] || exit 0
          if python -c "import json,sys; sys.exit(0 if json.load(open('data/logs/problems.json'))['has_problems'] else 1)"; then
            title="Refresh problems $(date -u +%Y-%m)"
            num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file data/logs/run_report.md
            else
              gh issue create --title "$title" --body-file data/logs/run_report.md
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_id }}
          path: |
            data/logs/*.csv
            data/logs/*.json
            data/logs/*.md
          retention-days: 60

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
