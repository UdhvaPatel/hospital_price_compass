name: check

# Weekly: look for new hospitals and changed or broken price files (by fingerprint).
# If anything changed, start the refresh workflow.
on:
  schedule:
    - cron: "17 9 * * 1"      # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write              # to start the refresh workflow

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore pipeline state from the private vault
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: python -m hpc.vault pull

      - name: Check hospitals and price files
        id: check
        run: python -m hpc.pipeline check

      - name: Start the refresh if anything changed
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh.yml --ref "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-${{ github.run_id }}
          path: data/logs/check.json
          retention-days: 30
